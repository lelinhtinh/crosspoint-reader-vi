name: CI
on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          clang-format --version

      - name: Run cppcheck
        run: pio check --fail-on-defect low --fail-on-defect medium --fail-on-defect high

      - name: Run clang-format
        run: ./bin/clang-format-fix && git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && git --no-pager diff --name-only && exit 1)

      - name: Build and run semver tests
        run: |
          g++ -I src -std=c++17 test/semver/test_semver.cpp src/network/semver.cpp -o test/semver/test_semver
          ./test/semver/test_semver

      - name: Run hyphenation evaluation tests
        run: |
          chmod +x test/hyphenation_eval/run_hyphenation_eval.sh
          ./test/hyphenation_eval/run_hyphenation_eval.sh

      - name: Run Vietnamese font tests
        run: |
          chmod +x test/vietnamese_font_test/run_test.sh
          ./test/vietnamese_font_test/run_test.sh

      - name: Build CrossPoint
        run: pio run
